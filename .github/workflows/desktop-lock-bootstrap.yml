name: Bootstrap desktop lockfiles
on:
  push:
    branches: [feat/issue-4-desktop-foundation]
permissions:
  contents: write
jobs:
  lockfiles:
    if: "!contains(github.event.head_commit.message, '[lock bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependency locks
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated locks (implementation branch only)
        shell: bash
        run: |
          git add package-lock.json apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock npm and Rust dependencies [lock bootstrap]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
