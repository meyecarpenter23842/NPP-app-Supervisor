name: Format Rust source M1.2
on:
  push:
    branches: [feat/issue-5-sqlite-operator]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Commit Rustfmt on implementation branch
        shell: bash
        run: |
          git add apps/desktop/src-tauri/src/storage.rs apps/desktop/src-tauri/src/lib.rs
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply rustfmt to M1.2 storage [format bootstrap]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
