name: Desktop foundation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    name: frontend-lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  windows:
    name: windows-rust-check-test-build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: NSIS configuration/version contract
        run: python tests/check_installer_versions.py
      - name: Build NSIS installer with embedded offline WebView2 runtime
        run: npm run tauri -- build --bundles nsis
        working-directory: apps/desktop
      - name: Native install/restart/uninstall/reinstall persistence smoke
        shell: pwsh
        run: |
          ./tests/windows_installer_smoke.ps1 -InstallerDir "apps/desktop/src-tauri/target/release/bundle/nsis" -EvidenceDir "artifacts/windows-installer"
      - name: Preserve NSIS artifact and SHA provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-nsis-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/windows-installer/*.json
          if-no-files-found: error
          retention-days: 7
