name: M1.3 one-time dependency and format bootstrap
on:
  push:
    branches: [feat/issue-6-ipc-onboarding-shell]
permissions:
  contents: write
jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[m13 bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Resolve Rust dependency lock and apply rustfmt
        run: |
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
      - name: Commit reproducible lockfile and formatting to feature branch
        shell: bash
        run: |
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/src/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: M1.3 lockfile and rustfmt [m13 bootstrap]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
